<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .container{
            background:white;
            width:900px;
            max-width:100%;
            border-radius:15px;
            padding:35px;
            box-shadow:0 10px 30px rgba(0,0,0,.3);
        }

        h1{
            text-align:center;
            color:#0d6efd;
            margin-bottom:25px;
        }

        form{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:18px;
        }

        input{
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        input:focus{
            outline:none;
            border-color:#0d6efd;
            box-shadow:0 0 8px rgba(13,110,253,.3);
        }

        .btn{
            grid-column:span 2;
            padding:14px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:8px;
            font-size:18px;
            cursor:pointer;
            transition:.3s;
        }

        .btn:hover{
            background:#084298;
        }

        .result{
            margin-top:30px;
            text-align:center;
            padding:18px;
            border-radius:10px;
            font-size:22px;
            font-weight:bold;
        }

        .positive{
            background:#fde2e2;
            color:#b00020;
        }

        .negative{
            background:#d4edda;
            color:#155724;
        }

        @media(max-width:700px){

            form{
                grid-template-columns:1fr;
            }

            .btn{
                grid-column:span 1;
            }

        }

    </style>

</head>

<body>

<div class="container">

<h1>❤️ Heart Disease Prediction System</h1>

<form action="/predict" method="POST">

<input type="number" name="age" placeholder="Age" required>

<input type="number" name="sex" placeholder="Sex (0 = Female, 1 = Male)" required>

<input type="number" name="cp" placeholder="Chest Pain Type" required>

<input type="number" name="trestbps" placeholder="Resting Blood Pressure" required>

<input type="number" name="chol" placeholder="Cholesterol" required>

<input type="number" name="fbs" placeholder="Fasting Blood Sugar" required>

<input type="number" name="restecg" placeholder="Rest ECG" required>

<input type="number" name="thalach" placeholder="Maximum Heart Rate" required>

<input type="number" name="exang" placeholder="Exercise Induced Angina" required>

<input type="number" step="0.1" name="oldpeak" placeholder="Old Peak" required>

<input type="number" name="slope" placeholder="Slope" required>

<input type="number" name="ca" placeholder="Major Vessels (CA)" required>

<input type="number" name="thal" placeholder="Thalassemia" required>

<button class="btn">Predict</button>

</form>

{% if prediction %}

<div class="result {% if 'Detected' in prediction %}positive{% else %}negative{% endif %}">
    {{ prediction }}
</div>

{% endif %}

</div>

</body>
</html>
